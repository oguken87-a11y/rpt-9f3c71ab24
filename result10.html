const LABELS=['1｜あなたが止まっているところ','2｜そう判断した理由','3｜最初にやること',
              '4｜やってはいけないこと','5｜無料Zoom勉強会でお伝えすること'];

let fillPh=false;
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* 【　】を差し込むか、そのまま強調表示するか */
function ph(text,d){
  const map={'【年代】':d.age,'【好みの年代】':d.pref,'【なりたい関係】':d.goal};
  return esc(text).replace(/【[^】]*】/g,m=>
    '<span class="ph">'+esc(fillPh&&map[m]!==undefined?map[m]:m)+'</span>');
}

function resultHTML(d){
  const c=CATS[d.cat];
  let h='';
  h+='<p class="brand">─ 診断結果 ─</p>';
  h+='<div class="badgewrap"><span class="badgelabel">あなたのつまずき</span>'
    +'<span class="badge" style="background:'+c.color+'">'+esc(c.name)+'</span>'
    +'<span class="typename" style="color:'+c.color+'">'+esc(d.type)+'</span></div>';
  h+='<div class="rcard"><p class="rlabel">'+LABELS[0]+'</p><p class="rtitle">'+ph(d.stuck,d)+'</p></div>';
  h+='<div class="rcard"><p class="rlabel">'+LABELS[1]+'</p><p>'+ph(d.reason,d)+'</p></div>';
  h+='<div class="rcard"><p class="rlabel">'+LABELS[2]+'</p><p>'+ph(d.fix,d)+'</p></div>';
  h+='<div class="rcard avoidbox"><p class="rlabel">'+LABELS[3]+'</p><p>'+ph(d.avoid,d)+'</p></div>';
  h+='<div class="rcard zoombox"><p class="rlabel">'+LABELS[4]+'</p><p>'+ph(d.zoom,d)+'</p></div>';
  h+='<button class="btn" style="margin-top:18px" onclick="alert(\'本番: Zoom勉強会の予約ページへ遷移（URL未定）\')">無料Zoom勉強会の日程を確認する</button>';
  return h;
}

function render(){
  let h='<div class="grid">';
  D.forEach(d=>{
    const c=CATS[d.cat];
    h+='<div class="gcard"><div class="ghead" style="background:'+c.color+'">'
      +d.id+'｜'+esc(c.name)+'　'+esc(d.type)+'</div>'
      +'<div class="gbody"><div class="wrap">'+resultHTML(d)+'</div></div></div>';
  });
  document.getElementById('stage').innerHTML=h+'</div>';
}
function togglePh(){ fillPh=!fillPh; document.getElementById('phstate').textContent=fillPh?'ON':'OFF'; render(); }
