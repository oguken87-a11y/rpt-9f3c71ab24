const FSTEPS=['女性と出会う','会話する','距離を縮める','関係が進む'];
let cur=0, mode='one', showFunnel=true;
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function funnelHTML(f){
  if(!showFunnel) return '';
  let rows='';
  f.forEach((v,i)=>{
    const cls=v===2?'here':(v===1?'done':'todo');
    const mark=v===2?'●':(v===1?'✓':'－');
    const stat=v===2?'← あなたは今ここ':(v===1?'できています':'');
    rows+='<div class="frow '+cls+'"><span class="fmark">'+mark+'</span><span class="fname">'+FSTEPS[i]+'</span><span class="fstat">'+stat+'</span></div>';
  });
  return '<div class="funnel"><p class="fcap">あなたの現在地</p>'+rows+'</div>';
}

function resultHTML(d,compact){
  const t=TYPES[d.type];
  let h='';
  h+='<p class="brand">─ 診断結果 ─</p>';
  h+='<p class="rlead">'+esc(d.lead)+'</p>';
  h+='<span class="badge" style="background:'+t.color+'">'+t.name+'</span>';
  h+=funnelHTML(d.funnel);
  h+='<div class="rcard"><p class="rlabel">1｜あなたが止まっているところ</p><p class="rtitle">'+esc(d.title)+'</p></div>';
  h+='<div class="rcard"><p class="rlabel">2｜そう判断した理由</p><p>'+esc(d.reason)+'</p>'
    +'<p class="sigcap">▼ 判断のもとになった、あなたの回答</p><ul class="sigs">'
    +d.sigs.map(s=>'<li>'+esc(s)+'</li>').join('')+'</ul></div>';
  h+='<div class="rcard"><p class="rlabel">3｜最初にやること</p><p>'+esc(d.fix)+'</p></div>';
  h+='<div class="rcard avoidbox"><p class="rlabel">4｜やってはいけないこと</p><p>'+esc(d.avoid)+'</p></div>';
  h+='<div class="rcard zoombox"><p class="rlabel">5｜無料Zoomでお伝えすること</p><p>'+esc(d.zoom)+'</p></div>';
  h+='<button class="btn" style="margin-top:18px" onclick="alert(\'本番: Zoom予約ページへ遷移（URL未定）\')">無料Zoomの日程を確認する</button>';
  h+='<p class="cta-note">※モックのため仮ボタンです（遷移先URLは未決事項）</p>';
  h+='<details class="dev"><summary>この結果になる回答（確認用・本番では出ません）</summary>'
    +'<div class="devpanel"><b>'+d.id+' '+t.name+'／sub: '+d.sub+'（'+esc(d.tab)+'）</b><br>'+esc(d.persona)+'</div></details>';
  return h;
}

function renderTabs(){
  const el=document.getElementById('tabs');
  let h='',prev='';
  D.forEach((d,i)=>{
    if(prev&&prev!==d.type) h+='<div class="tabsep"></div>';
    prev=d.type;
    const on=(mode==='one'&&i===cur)?' on '+TYPES[d.type].cls:'';
    h+='<button class="tab'+on+'" onclick="go('+i+')"><span class="tn" style="color:'+((mode==='one'&&i===cur)?'#fff':TYPES[d.type].color)+'">'+d.id+'</span>'+esc(d.tab)+'</button>';
  });
  el.innerHTML=h;
}

function render(){
  const st=document.getElementById('stage');
  if(mode==='one'){
    st.innerHTML='<div class="wrap">'+resultHTML(D[cur])+'</div>';
    document.getElementById('navfoot').style.display='flex';
    document.getElementById('cnt').textContent=(cur+1)+' / '+D.length;
    document.getElementById('prev').disabled=(cur===0);
    document.getElementById('next').disabled=(cur===D.length-1);
    document.body.style.paddingBottom='80px';
    window.scrollTo(0,0);
  }else{
    let h='<div class="grid">';
    D.forEach(d=>{
      const t=TYPES[d.type];
      h+='<div class="gcard"><div class="ghead" style="background:'+t.color+'">'+d.id+'｜'+t.name+'　'+esc(d.tab)+'</div>'
        +'<div class="gbody"><div class="wrap">'+resultHTML(d)+'</div></div></div>';
    });
    st.innerHTML=h+'</div>';
    document.getElementById('navfoot').style.display='none';
    document.body.style.paddingBottom='20px';
  }
  renderTabs();
}
function go(i){ if(mode!=='one'){mode='one';document.getElementById('m1').classList.add('on');document.getElementById('m2').classList.remove('on');} cur=i; render(); }
function step(n){ const t=cur+n; if(t>=0&&t<D.length){cur=t;render();} }
function setMode(m){
  mode=m;
  document.getElementById('m1').classList.toggle('on',m==='one');
  document.getElementById('m2').classList.toggle('on',m==='all');
  render();
}
function toggleFunnel(){ showFunnel=!showFunnel; document.getElementById('fnstate').textContent=showFunnel?'ON':'OFF'; render(); }
document.addEventListener('keydown',e=>{
  if(mode!=='one') return;
  if(e.key==='ArrowRight') step(1);
  if(e.key==='ArrowLeft') step(-1);
});
render();
</script>
